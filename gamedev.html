        <!--
        TO ADD ANOTHER PROJECT LATER:
        copy the whole <div class="project"> ... </div> block above,
        paste it below, and update the folder path (gamedev/project2/...),
        video ID, name, meta info and stills.
        -->

    </section>

     <script>
        document.querySelectorAll('.project').forEach(function (project) {
            var btn = project.querySelector('.project-toggle');
            var content = project.querySelector('.project-content');

            function setOpenHeight() {
                if (project.classList.contains('open')) {
                    content.style.maxHeight = content.scrollHeight + 'px';
                }
            }

            btn.addEventListener('click', function () {
                var isOpen = project.classList.toggle('open');
                btn.setAttribute('aria-expanded', isOpen);
                content.style.maxHeight = isOpen ? content.scrollHeight + 'px' : null;
            });

            // Recalculate if images finish loading after the click
            content.querySelectorAll('img').forEach(function (img) {
                img.addEventListener('load', setOpenHeight);
            });

            // Recalculate if the layout changes (e.g. resize, orientation change)
            window.addEventListener('resize', setOpenHeight);
        });
    </script>
</body>
